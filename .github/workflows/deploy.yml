name: Deploy (staging)

# P3.T5 — on merge to main, push migrations + deploy Edge Functions to the staging Supabase
# project (Backend §12). Requires repo secrets: SUPABASE_ACCESS_TOKEN (sbp_…),
# SUPABASE_STAGING_PROJECT_REF, SUPABASE_STAGING_DB_PASSWORD. Gated by the `staging-deploy`
# Environment (optional required reviewers). Tagged-release → prod is added in P12.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrations + Edge Functions → staging
    runs-on: ubuntu-latest
    environment: staging-deploy
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging project
        run: supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}

      - name: Push database migrations
        run: supabase db push --password "$DB_PASSWORD"
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
